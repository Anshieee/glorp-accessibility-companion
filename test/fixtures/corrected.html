<!DOCTYPE html>
<!--
  Accessibility Companion demo fixture — CORRECTED registration page.
  Same layout, content, destinations, element IDs and submit handler as the
  flawed fixture; every seeded violation repaired WITHOUT deleting content,
  hiding elements or dropping behavior:
    - html lang="en" (content language is English)
    - img has a meaningful alternative describing the illustration
    - select and full-name input get correctly associated visible labels
    - icon link gets an accessible name describing its destination
    - icon button gets an accessible name describing the submit action
    - paragraph color raised to #444444 on white (≥4.5:1), same text
  For scanner tests only; the public demo repair loop edits the flawed page's
  source at the same URL instead of switching URLs.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Community Volunteer Day — Registration</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; }
    .page { max-width: 640px; margin: 0 auto; padding: 24px; }
    .hero-icon { display: inline-block; }
    .status { margin-top: 16px; font-weight: 600; }
  </style>
</head>
<body>
  <main class="page">
    <!-- CORRECTED: meaningful alternative on the informative illustration. -->
    <img src="/fixtures/illustration.svg" width="460" height="300"
         alt="Community volunteers registering attendees at a help desk">
    <h1>Community Volunteer Day — Registration</h1>
    <p class="intro" style="color:#444444; background:#ffffff; padding:16px;">
      Register below to join the neighborhood volunteer day. English page;
      JavaScript must remain enabled for submission behavior.
    </p>

    <form id="registration-form" onsubmit="submitRegistration(event); return false;">
      <div class="field">
        <label class="field-label" for="reg-fullname">Full name</label>
        <input type="text" id="reg-fullname" name="fullname" autocomplete="name">
      </div>
      <div class="field">
        <label class="field-label" for="reg-email">Email address</label>
        <input type="email" id="reg-email" name="email" autocomplete="email">
      </div>
      <div class="field">
        <label class="field-label" for="reg-role">Availability slot</label>
        <select id="reg-role" name="role">
          <option value="">Choose a slot…</option>
          <option value="morning">Morning shift (9–12)</option>
          <option value="afternoon">Afternoon shift (13–16)</option>
          <option value="evening">Evening shift (17–20)</option>
        </select>
      </div>
      <!-- CORRECTED: icon button now has an accessible name for its action. -->
      <button type="submit" id="btn-submit" aria-label="Submit registration">
        <svg class="hero-icon" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="currentColor">
          <path d="M9.6 17.2 4.4 12l1.4-1.4 3.8 3.8 8.6-8.6L19.6 7 9.6 17.2z"/>
        </svg>
      </button>
      <span id="registration-status" class="status" role="status"></span>
    </form>

    <!-- CORRECTED: icon link now carries an accessible name for its
         destination (/fixtures/help.html, the registration help page). -->
    <a href="/fixtures/help.html" id="link-help" class="icon-link" aria-label="Registration help">
      <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="currentColor">
        <path d="M11 18h2v-2h-2v2zm1-16A10 10 0 0 0 2 12h2a8 8 0 1 1 16 0c0 4-3 5-5 6-1.5.7-2 1.3-2 4h-2c0-3.5-1.3-4.2-2.5-6C9 14.6 8 13 8 11A5 5 0 0 1 12 6z"/>
      </svg>
    </a>
  </main>

  <script>
    function submitRegistration(event) {
      event.preventDefault();
      var nameInput = document.getElementById('reg-fullname');
      var status = document.getElementById('registration-status');
      var name = nameInput.value.trim();
      if (!name) {
        status.textContent = 'Please enter your full name to complete the registration.';
        status.style.color = '#8a1c1c';
        return;
      }
      status.textContent = 'Registration submitted for ' + name + '.';
      status.style.color = '#1c5c1c';
    }
  </script>
</body>
</html>
